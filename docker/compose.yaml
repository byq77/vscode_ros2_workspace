services:
  ros2_kilted_nvidia:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      tags:
        - ros2_kilted_nvidia:latest
      target: app
      args:
        - BASE_DOCKER_IMAGE=osrf/ros:kilted-desktop-full
        - WORKSPACE=/ros_ws
    container_name: ros2_kilted_nvidia
    volumes:
      # - type: bind
      #   source: /dev
      #   target: /dev
      - type: bind
        source: ../
        target: /ros_ws
      # X11 Host
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        consistency: cached
      # Wayland host
      - type: bind
        source: /mnt/wslg
        target: /mnt/wslg
        consistency: cached
      # uncomment to use intel iGPU
      # - type: bind
      #   source: /dev/dri
      #   target: /dev/dri
      - type: bind
        source: /run/user/1000
        target: /run/user/1000
    # privileged: true
    # network: host
    runtime: nvidia
    ipc: host
    tty: true
    gpus: all
    cap_add:
      - SYS_PTRACE
    group_add:
      - tty
      - audio      
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      - ROS_DOMAIN_ID=1
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=${XAUTHORITY}
      # For Wayland
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      # For audio
      - PULSE_SERVER=${PULSE_SERVER}
      # Needed for software rendering of opengl
      - LIBGL_ALWAYS_SOFTWARE=1
    # Overrides default entrypoint so things don't shut down after the process ends.
    command: sleep infinity
